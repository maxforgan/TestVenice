<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>exposé</title>
    <!-- Load config.js if it exists (optional, gitignored) -->
    <script src="config.js" onerror="console.log('No config.js found - using manual settings')"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            position: fixed;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #000;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Header */
        .header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1a1a1a;
            background: #000;
            z-index: 10;
        }

        .menu-btn, .settings-btn {
            background: none;
            border: none;
            color: #666;
            font-size: 24px;
            cursor: pointer;
            padding: 8px;
            transition: all 0.2s ease;
            border-radius: 8px;
        }

        .menu-btn:hover, .settings-btn:hover {
            color: #fff;
            background: rgba(255,255,255,0.05);
            transform: scale(1.05);
        }

        .menu-btn:active, .settings-btn:active {
            transform: scale(0.95);
        }

        /* Main Content */
        .main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            padding: 20px;
        }

        .logo {
            font-size: 72px;
            font-family: 'Georgia', serif;
            font-style: italic;
            font-weight: 300;
            text-align: center;
            opacity: 0.9;
            transition: opacity 0.3s ease;
        }

        .output {
            width: 100%;
            max-width: 800px;
            padding: 20px;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .output img, .output video {
            width: 100%;
            border-radius: 12px;
            margin-bottom: 20px;
            animation: fadeIn 0.3s ease;
        }

        /* Bottom Input Area */
        .input-area {
            padding: 20px;
            padding-bottom: 80px;
            border-top: 1px solid #1a1a1a;
            background: #000;
            backdrop-filter: blur(10px);
        }

        /* iOS Safari bottom bar fix */
        @supports (padding: max(0px)) {
            .input-area {
                padding-bottom: max(80px, calc(env(safe-area-inset-bottom) + 40px));
            }
        }

        .input-container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
        }

        .mode-tabs {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
        }

        .mode-tab {
            background: none;
            border: none;
            color: #666;
            font-size: 15px;
            cursor: pointer;
            padding: 8px 0;
            position: relative;
            transition: color 0.2s ease;
        }

        .mode-tab:hover {
            color: #aaa;
        }

        .mode-tab.active {
            color: #fff;
        }

        .mode-tab.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: #fff;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { transform: scaleX(0); }
            to { transform: scaleX(1); }
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
            align-items: center;
            background: #1a1a1a;
            border-radius: 24px;
            padding: 16px 20px;
            transition: all 0.2s ease;
            position: relative;
        }

        .input-wrapper:focus-within {
            background: #222;
            box-shadow: 0 0 0 1px rgba(255,255,255,0.1);
        }

        .input-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-height: 88px;
            justify-content: center;
        }

        .model-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            opacity: 0.5;
            font-size: 11px;
            color: #666;
            cursor: pointer;
            transition: all 0.2s ease;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .model-indicator:hover {
            opacity: 1;
            background: rgba(255,255,255,0.05);
        }

        .model-select {
            display: none;
        }

        textarea {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 18px;
            resize: none;
            outline: none;
            min-height: 44px;
            max-height: 300px;
            font-family: inherit;
            line-height: 1.4;
            padding: 0;
            width: 100%;
            transition: opacity 0.2s ease;
        }

        textarea::placeholder {
            color: #666;
            transition: color 0.2s ease;
        }

        textarea:focus::placeholder {
            color: #555;
        }

        .send-btn {
            background: #fff;
            border: none;
            color: #000;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            flex-shrink: 0;
        }

        .send-btn:hover:not(:disabled) {
            background: #e0e0e0;
            transform: scale(1.08);
        }

        .send-btn:active:not(:disabled) {
            transform: scale(0.92);
        }

        .send-btn:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
            opacity: 0.4;
        }

        /* Settings Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            padding: 20px;
            overflow-y: auto;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal.active {
            display: block;
            animation: modalFadeIn 0.3s ease forwards;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            max-width: 600px;
            margin: 60px auto;
            animation: modalSlideIn 0.3s ease;
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .modal h2 {
            font-size: 24px;
        }

        .close-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 28px;
            cursor: pointer;
            transition: all 0.2s ease;
            padding: 4px 8px;
            border-radius: 8px;
        }

        .close-btn:hover {
            background: rgba(255,255,255,0.1);
            transform: scale(1.1);
        }

        .close-btn:active {
            transform: scale(0.9);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #999;
            font-size: 14px;
            margin-bottom: 8px;
            transition: color 0.2s ease;
        }

        input[type="text"] {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #555;
            background: #222;
        }

        .save-btn {
            width: 100%;
            background: #fff;
            color: #000;
            border: none;
            padding: 16px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            transform: translateZ(0);
        }

        .save-btn:hover {
            background: #f0f0f0;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255,255,255,0.1);
        }

        .save-btn:active {
            transform: translateY(0);
            box-shadow: none;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            animation: fadeIn 0.3s ease;
        }

        .error {
            background: #2a0000;
            color: #ff6b6b;
            border: 1px solid #ff6b6b33;
        }

        .success {
            background: #002a00;
            color: #69db7c;
            border: 1px solid #69db7c33;
        }

        .loading {
            text-align: center;
            color: #666;
            padding: 40px;
            animation: pulse 1.5s ease infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
    </div>

    <!-- Main Content -->
    <div class="main" id="main">
        <div class="logo" id="logo">exposé</div>
        <div class="output" id="output" style="display: none;"></div>
    </div>

    <!-- Bottom Input -->
    <div class="input-area">
        <div class="input-container">
            <div class="mode-tabs">
                <button class="mode-tab active" data-mode="text" onclick="switchMode('text')">Text</button>
                <button class="mode-tab" data-mode="image" onclick="switchMode('image')">Image</button>
                <button class="mode-tab" data-mode="character" onclick="switchMode('character')">Investment Banker</button>
            </div>
            <div class="input-wrapper">
                <div class="input-content">
                    <textarea id="promptInput" placeholder="Message..." rows="1" oninput="autoResize(this)"></textarea>
                    <div class="model-indicator" onclick="showModelPicker()">
                        <span id="currentModelName">Loading...</span>
                    </div>
                </div>
                <button class="send-btn" id="sendBtn" onclick="generate()">↑</button>
                <select class="model-select" id="modelSelect" onchange="updateModelIndicator()">
                    <option>Loading...</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Menu Modal -->
    <div class="modal" id="menuModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Settings</h2>
                <button class="close-btn" onclick="closeMenu()">×</button>
            </div>

            <div class="form-group">
                <label>Venice API Key</label>
                <input type="text" id="apiKeyInput" placeholder="Enter your API key">
                <small style="color: #666; display: block; margin-top: 5px;">
                    Get your key at <a href="https://venice.ai" target="_blank" style="color: #fff;">venice.ai</a>
                </small>
            </div>
            <div class="form-group">
                <label>API Base URL</label>
                <input type="text" id="apiUrlInput" value="https://api.venice.ai/api/v1">
            </div>
            <div class="form-group">
                <label>Investment Banker Character ID</label>
                <input type="text" id="characterIdInput" placeholder="Enter your Venice character ID">
                <small style="color: #666; display: block; margin-top: 5px;">
                    Find your character ID at <a href="https://venice.ai/characters" target="_blank" style="color: #fff;">venice.ai/characters</a>
                </small>
            </div>

            <div class="form-group" style="border-top: 1px solid #333; padding-top: 20px; margin-top: 20px;">
                <label>Skills</label>
                <small style="color: #666; display: block; margin-bottom: 10px;">
                    Upload text files (.txt, .md) containing instructions or knowledge for the AI
                </small>
                <input type="file" id="skillFileInput" accept=".txt,.md" multiple style="display: none;" onchange="handleSkillUpload(event)">
                <button class="save-btn" onclick="document.getElementById('skillFileInput').click()" style="background: #4a9eff; margin-bottom: 10px;">
                    Upload Skills
                </button>
                <div id="skillsList" style="margin-top: 10px;"></div>
            </div>

            <button class="save-btn" onclick="saveSettings()">Save Settings</button>
            <button class="save-btn" onclick="testImageAPI()" style="background: #333; margin-top: 10px;">Test Image Generation</button>
            <button class="save-btn" onclick="showAllModels()" style="background: #444; margin-top: 10px;">Debug: Show All Available Models</button>
            <div id="settingsMsg"></div>
        </div>
    </div>

    <script>
        let currentMode = 'text';
        let settings = { apiKey: '', apiUrl: 'https://api.venice.ai/api/v1', characterId: '', skills: [] };
        let chatHistory = [];

        // Load settings from config.js if available (highest priority)
        if (typeof CONFIG !== 'undefined') {
            console.log('Loading settings from config.js');
            settings.apiKey = CONFIG.apiKey || '';
            settings.apiUrl = CONFIG.apiUrl || 'https://api.venice.ai/api/v1';
            settings.characterId = CONFIG.characterId || '';
        }

        // Load settings from localStorage (overrides config.js if present)
        const saved = localStorage.getItem('veniceSettings');
        if (saved) {
            const savedSettings = JSON.parse(saved);
            // Only override if localStorage has actual values
            if (savedSettings.apiKey) settings.apiKey = savedSettings.apiKey;
            if (savedSettings.apiUrl) settings.apiUrl = savedSettings.apiUrl;
            if (savedSettings.characterId) settings.characterId = savedSettings.characterId;
            if (savedSettings.skills) settings.skills = savedSettings.skills;
        }

        // Auto-resize textarea
        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        // Model picker functions
        function showModelPicker() {
            const select = document.getElementById('modelSelect');
            select.style.display = 'block';
            select.style.position = 'absolute';
            select.style.bottom = '60px';
            select.style.left = '16px';
            select.style.zIndex = '100';
            select.style.background = '#2a2a2a';
            select.style.padding = '10px';
            select.style.borderRadius = '8px';
            select.style.maxWidth = '200px';
            select.focus();

            // Hide on blur
            select.onblur = () => {
                setTimeout(() => {
                    select.style.display = 'none';
                }, 150);
            };
        }

        function updateModelIndicator() {
            const select = document.getElementById('modelSelect');
            const indicator = document.getElementById('currentModelName');
            const selectedOption = select.options[select.selectedIndex];
            let displayName = selectedOption.textContent;

            // Truncate long model names
            if (displayName.length > 20) {
                displayName = displayName.substring(0, 20) + '...';
            }

            indicator.textContent = displayName;
        }

        // Switch mode
        function switchMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.mode === mode);
            });

            // Update placeholder
            const placeholders = {
                text: 'Message...',
                image: 'Describe the image you want...',
                video: 'Describe the video you want...'
            };
            document.getElementById('promptInput').placeholder = placeholders[mode];

            loadModels();
        }

        // Hardcoded Venice models (fallback if API doesn't provide them)
        const knownImageModels = [
            { id: 'fluently-xl', name: 'Fluently XL' },
            { id: 'flux-pro', name: 'Flux Pro' },
            { id: 'flux-1.1-pro', name: 'Flux 1.1 Pro' },
            { id: 'stable-diffusion-xl', name: 'Stable Diffusion XL' }
        ];

        const knownVideoModels = [
            { id: 'wan-2.5-preview', name: 'Wan 2.5 Preview' },
            { id: 'ltx-video', name: 'LTX Video' },
            { id: 'kling-1.5', name: 'Kling 1.5' }
        ];

        // Load models
        async function loadModels() {
            if (!settings.apiKey) {
                document.getElementById('modelSelect').innerHTML = '<option>Set API key</option>';
                return;
            }

            const select = document.getElementById('modelSelect');
            select.innerHTML = '<option>Loading...</option>';

            try {
                const res = await fetch(settings.apiUrl + '/models', {
                    headers: { 'Authorization': 'Bearer ' + settings.apiKey }
                });

                if (!res.ok) {
                    const errorText = await res.text();
                    console.error('API Error:', res.status, errorText);
                    throw new Error('API error: ' + res.status);
                }

                const data = await res.json();
                const allModels = data.data || [];
                console.log('Total models:', allModels.length);
                console.log('All model IDs:', allModels.map(m => m.id).join(', '));

                let models = [...allModels];

                // Filter by mode
                if (currentMode === 'text') {
                    const filtered = allModels.filter(m => {
                        const id = m.id.toLowerCase();
                        // Exclude image and video models
                        return !id.includes('flux') && !id.includes('stable') && !id.includes('sd') &&
                               !id.includes('dall-e') && !id.includes('video') && !id.includes('image') &&
                               !id.includes('wan') && !id.includes('kling') && !id.includes('veo') &&
                               !id.includes('ltx') && !id.includes('longcat') && !id.includes('sora') &&
                               !id.includes('qwen-image') && !id.includes('hidream') && !id.includes('lustify') &&
                               !id.includes('seedream') && !id.includes('nano') && !id.includes('z-image');
                    });
                    models = filtered.length > 0 ? filtered : allModels;
                } else if (currentMode === 'image') {
                    const filtered = allModels.filter(m => {
                        const id = m.id.toLowerCase();
                        return id.includes('flux') || id.includes('stable') || id.includes('sd') ||
                               id.includes('dall-e') || id.includes('image') || id.includes('qwen') ||
                               id.includes('hidream') || id.includes('lustify') || id.includes('seedream') ||
                               id.includes('nano') || id.includes('z-image') || id.includes('gpt-image') ||
                               id.includes('anime');
                    });
                    // If API doesn't return image models, use hardcoded list
                    models = filtered.length > 0 ? filtered : knownImageModels;
                } else if (currentMode === 'character') {
                    // For character mode, use the same models as text mode
                    const filtered = allModels.filter(m => {
                        const id = m.id.toLowerCase();
                        // Exclude image models
                        return !id.includes('flux') && !id.includes('stable') && !id.includes('sd') &&
                               !id.includes('dall-e') && !id.includes('image') &&
                               !id.includes('qwen-image') && !id.includes('hidream') && !id.includes('lustify') &&
                               !id.includes('seedream') && !id.includes('nano') && !id.includes('z-image');
                    });
                    models = filtered.length > 0 ? filtered : allModels;
                }

                console.log('Filtered models for', currentMode + ':', models.length);

                select.innerHTML = '';
                models.forEach(m => {
                    const opt = document.createElement('option');
                    opt.value = m.id;
                    const displayName = m.name || m.id;
                    opt.textContent = displayName.length > 25 ? displayName.substring(0, 25) + '...' : displayName;
                    select.appendChild(opt);
                });

                if (models.length === 0) {
                    select.innerHTML = '<option>No models available</option>';
                }

                // Update the indicator with the first model
                updateModelIndicator();
            } catch (e) {
                console.error('Error loading models:', e);
                select.innerHTML = '<option>Error: ' + e.message + '</option>';
            }
        }

        // Generate content
        async function generate() {
            const prompt = document.getElementById('promptInput').value.trim();
            if (!prompt || !settings.apiKey) {
                if (!settings.apiKey) openSettings();
                return;
            }

            const model = document.getElementById('modelSelect').value;
            const output = document.getElementById('output');
            const logo = document.getElementById('logo');
            const sendBtn = document.getElementById('sendBtn');

            // Show output area
            logo.style.display = 'none';
            output.style.display = 'block';
            sendBtn.disabled = true;

            try {
                if (currentMode === 'text') {
                    output.innerHTML = '<div class="loading">Thinking...</div>';

                    chatHistory.push({ role: 'user', content: prompt });

                    // Prepare messages with skills context if available
                    let messages = chatHistory;
                    const skillsContext = getSkillsContext();
                    if (skillsContext && chatHistory.length === 1) {
                        // First message - prepend system message with skills
                        messages = [
                            { role: 'system', content: 'You are a helpful AI assistant.' + skillsContext },
                            ...chatHistory
                        ];
                    }

                    const res = await fetch(settings.apiUrl + '/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Authorization': 'Bearer ' + settings.apiKey,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            model: model,
                            messages: messages
                        })
                    });

                    if (!res.ok) throw new Error('API error: ' + res.status);

                    const data = await res.json();
                    const reply = data.choices[0].message.content;
                    chatHistory.push({ role: 'assistant', content: reply });

                    output.innerHTML = `
                        <div style="background: #1a1a1a; padding: 20px; border-radius: 12px; white-space: pre-wrap;">${reply}</div>
                    `;

                } else if (currentMode === 'image') {
                    output.innerHTML = '<div class="loading">Generating image...</div>';

                    const requestBody = {
                        prompt: prompt,
                        model: model,
                        width: 1024,
                        height: 1024
                    };
                    console.log('Image request:', settings.apiUrl + '/image/generate', requestBody);

                    const res = await fetch(settings.apiUrl + '/image/generate', {
                        method: 'POST',
                        headers: {
                            'Authorization': 'Bearer ' + settings.apiKey,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(requestBody)
                    });

                    if (!res.ok) {
                        const errorText = await res.text();
                        console.error('Image API Error:', res.status, errorText);
                        if (res.status === 404) {
                            throw new Error('Image generation not available with your API key. Visit <a href="https://venice.ai/account" target="_blank" style="color: #ff6b6b;">venice.ai/account</a> to enable it.');
                        }
                        throw new Error(`API error: ${res.status} - ${errorText}`);
                    }

                    const data = await res.json();
                    console.log('Image response:', data);
                    const imageUrl = data.url || data.images?.[0]?.url;

                    if (!imageUrl) throw new Error('No image URL in response');

                    output.innerHTML = `<img src="${imageUrl}" alt="Generated image">`;

                } else if (currentMode === 'character') {
                    if (!settings.characterId) {
                        throw new Error('Please set your Investment Banker Character ID in Settings first');
                    }

                    output.innerHTML = '<div class="loading">Consulting with your investment banker...</div>';

                    chatHistory.push({ role: 'user', content: prompt });

                    // Prepare messages with skills context if available
                    let messages = chatHistory;
                    const skillsContext = getSkillsContext();
                    if (skillsContext && chatHistory.length === 1) {
                        // First message - prepend system message with skills
                        messages = [
                            { role: 'system', content: 'You are a professional investment banker.' + skillsContext },
                            ...chatHistory
                        ];
                    }

                    const res = await fetch(settings.apiUrl + '/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Authorization': 'Bearer ' + settings.apiKey,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            model: model,
                            messages: messages,
                            character_id: settings.characterId
                        })
                    });

                    if (!res.ok) throw new Error('API error: ' + res.status);

                    const data = await res.json();
                    const reply = data.choices[0].message.content;
                    chatHistory.push({ role: 'assistant', content: reply });

                    output.innerHTML = `
                        <div style="background: #1a1a1a; padding: 20px; border-radius: 12px; white-space: pre-wrap;">
                            <div style="color: #4a9eff; font-weight: 600; margin-bottom: 10px;">Investment Banker</div>
                            ${reply}
                        </div>
                    `;
                }

                document.getElementById('promptInput').value = '';
            } catch (e) {
                output.innerHTML = `<div style="background: #2a0000; color: #ff6b6b; padding: 20px; border-radius: 12px;">Error: ${e.message}</div>`;
            } finally {
                sendBtn.disabled = false;
            }
        }

        // Settings
        function saveSettings() {
            settings.apiKey = document.getElementById('apiKeyInput').value.trim();
            settings.apiUrl = document.getElementById('apiUrlInput').value.trim();
            settings.characterId = document.getElementById('characterIdInput').value.trim();

            if (!settings.apiKey) {
                document.getElementById('settingsMsg').innerHTML = '<div class="error">Enter API key</div>';
                return;
            }

            localStorage.setItem('veniceSettings', JSON.stringify(settings));
            document.getElementById('settingsMsg').innerHTML = '<div class="success">Saved!</div>';

            setTimeout(() => {
                closeSettings();
                loadModels();
            }, 1000);
        }

        function toggleMenu() {
            document.getElementById('menuModal').classList.add('active');
            document.getElementById('apiKeyInput').value = settings.apiKey;
            document.getElementById('apiUrlInput').value = settings.apiUrl;
            document.getElementById('characterIdInput').value = settings.characterId || '';
            renderSkillsList();
        }

        function closeMenu() {
            document.getElementById('menuModal').classList.remove('active');
        }

        // Alias for backward compatibility
        function openSettings() {
            toggleMenu();
        }

        function closeSettings() {
            closeMenu();
        }

        // Skills Management
        async function handleSkillUpload(event) {
            const files = event.target.files;
            if (!files || files.length === 0) return;

            for (const file of files) {
                try {
                    const text = await file.text();
                    const skill = {
                        name: file.name,
                        content: text,
                        uploadedAt: new Date().toISOString()
                    };

                    // Add to settings
                    if (!settings.skills) settings.skills = [];
                    settings.skills.push(skill);

                    console.log('Skill uploaded:', file.name);
                } catch (e) {
                    console.error('Error reading file:', e);
                    alert('Error reading file: ' + file.name);
                }
            }

            // Save and refresh UI
            localStorage.setItem('veniceSettings', JSON.stringify(settings));
            renderSkillsList();
            event.target.value = ''; // Reset file input
        }

        function renderSkillsList() {
            const container = document.getElementById('skillsList');
            if (!settings.skills || settings.skills.length === 0) {
                container.innerHTML = '<div style="color: #666; font-size: 13px; font-style: italic;">No skills uploaded yet</div>';
                return;
            }

            let html = '<div style="display: flex; flex-direction: column; gap: 8px;">';
            settings.skills.forEach((skill, index) => {
                html += `
                    <div style="background: #1a1a1a; padding: 10px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center;">
                        <div>
                            <div style="font-size: 13px; font-weight: 500;">${skill.name}</div>
                            <div style="font-size: 11px; color: #666;">${Math.round(skill.content.length / 1000)}KB</div>
                        </div>
                        <button onclick="removeSkill(${index})" style="background: #ff4444; border: none; color: #fff; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px;">Remove</button>
                    </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        function removeSkill(index) {
            if (confirm('Remove this skill?')) {
                settings.skills.splice(index, 1);
                localStorage.setItem('veniceSettings', JSON.stringify(settings));
                renderSkillsList();
            }
        }

        function getSkillsContext() {
            if (!settings.skills || settings.skills.length === 0) return '';

            let context = '\n\n<skills>\n';
            settings.skills.forEach(skill => {
                context += `<skill name="${skill.name}">\n${skill.content}\n</skill>\n\n`;
            });
            context += '</skills>\n\nUse the skills provided above when relevant to answer the user\'s questions.';
            return context;
        }

        async function testImageAPI() {
            const msgDiv = document.getElementById('settingsMsg');
            const key = document.getElementById('apiKeyInput').value.trim();
            const url = document.getElementById('apiUrlInput').value.trim();

            if (!key) {
                msgDiv.innerHTML = '<div class="error">Enter API key first</div>';
                return;
            }

            msgDiv.innerHTML = '<div class="loading">Testing image generation endpoint...</div>';

            try {
                const res = await fetch(url + '/image/generate', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + key,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        prompt: "a red cube",
                        model: "fluently-xl",
                        width: 512,
                        height: 512
                    })
                });

                const text = await res.text();
                console.log('Test response:', res.status, text);

                if (res.status === 404) {
                    msgDiv.innerHTML = '<div class="error">❌ Image generation not available (404).<br><br><strong>Your API key does not have image generation access.</strong><br><br>To enable image generation:<br>1. Visit <a href="https://venice.ai/account" target="_blank" style="color: #ff6b6b;">venice.ai/account</a><br>2. Check your API plan/credits<br>3. Ensure image generation is enabled<br><br>Currently, only <strong>text chat works</strong> with your key.</div>';
                } else if (!res.ok) {
                    msgDiv.innerHTML = `<div class="error">API Error: ${res.status}<br>${text}</div>`;
                } else {
                    msgDiv.innerHTML = '<div class="success">✓ Image generation works! You can use image mode.</div>';
                }
            } catch (e) {
                msgDiv.innerHTML = `<div class="error">Test failed: ${e.message}</div>`;
            }
        }

        async function showAllModels() {
            const msgDiv = document.getElementById('settingsMsg');
            const key = document.getElementById('apiKeyInput').value.trim();
            const url = document.getElementById('apiUrlInput').value.trim();

            if (!key) {
                msgDiv.innerHTML = '<div class="error">Enter API key first</div>';
                return;
            }

            msgDiv.innerHTML = '<div class="loading">Fetching all models...</div>';

            try {
                const modelsRes = await fetch(url + '/models', {
                    headers: { 'Authorization': 'Bearer ' + key }
                });

                if (!modelsRes.ok) {
                    throw new Error('Failed to fetch models: ' + modelsRes.status);
                }

                const modelsData = await modelsRes.json();
                const allModels = modelsData.data || [];

                // Categorize models
                const videoModels = allModels.filter(m => {
                    const id = m.id.toLowerCase();
                    return id.includes('video') || id.includes('wan') || id.includes('kling') ||
                           id.includes('veo') || id.includes('ltx') || id.includes('longcat') ||
                           id.includes('sora') || id.includes('ovi');
                });

                const imageModels = allModels.filter(m => {
                    const id = m.id.toLowerCase();
                    return id.includes('flux') || id.includes('stable') || id.includes('sd') ||
                           id.includes('dall-e') || id.includes('image') || id.includes('qwen') ||
                           id.includes('hidream') || id.includes('lustify') || id.includes('seedream');
                });

                const textModels = allModels.filter(m => !videoModels.includes(m) && !imageModels.includes(m));

                let html = '<div style="background: #1a1a1a; padding: 15px; border-radius: 8px; max-height: 400px; overflow-y: auto; text-align: left;">';
                html += '<h3 style="margin: 0 0 10px 0;">Models Available to Your API Key</h3>';

                html += '<p><strong>Total Models:</strong> ' + allModels.length + '</p>';

                html += '<p style="color: #4a9eff;"><strong>Video Models (' + videoModels.length + '):</strong></p>';
                if (videoModels.length > 0) {
                    html += '<ul style="margin: 5px 0; padding-left: 20px;">';
                    videoModels.forEach(m => html += '<li>' + m.id + '</li>');
                    html += '</ul>';
                } else {
                    html += '<p style="color: #ff6b6b;">❌ No video models available</p>';
                }

                html += '<p style="color: #4a9eff;"><strong>Image Models (' + imageModels.length + '):</strong></p>';
                if (imageModels.length > 0) {
                    html += '<ul style="margin: 5px 0; padding-left: 20px;">';
                    imageModels.slice(0, 10).forEach(m => html += '<li>' + m.id + '</li>');
                    if (imageModels.length > 10) html += '<li>... and ' + (imageModels.length - 10) + ' more</li>';
                    html += '</ul>';
                } else {
                    html += '<p style="color: #ff6b6b;">❌ No image models available</p>';
                }

                html += '<p style="color: #4a9eff;"><strong>Text Models (' + textModels.length + '):</strong></p>';
                if (textModels.length > 0) {
                    html += '<ul style="margin: 5px 0; padding-left: 20px;">';
                    textModels.slice(0, 10).forEach(m => html += '<li>' + m.id + '</li>');
                    if (textModels.length > 10) html += '<li>... and ' + (textModels.length - 10) + ' more</li>';
                    html += '</ul>';
                }

                html += '</div>';
                msgDiv.innerHTML = html;
            } catch (e) {
                msgDiv.innerHTML = `<div class="error">Failed to fetch models: ${e.message}</div>`;
            }
        }

        // Enter to send
        document.getElementById('promptInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                generate();
            }
        });

        // Auto-open settings if no API key
        if (!settings.apiKey) {
            setTimeout(() => openSettings(), 500);
        } else {
            loadModels();
        }
    </script>
</body>
</html>
