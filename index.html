<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venice AI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #000;
            color: #fff;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 { margin-bottom: 30px; text-align: center; }
        .section {
            background: #111;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            border: 1px solid #333;
        }
        label {
            display: block;
            margin: 15px 0 5px;
            color: #999;
            font-size: 14px;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            background: #000;
            border: 1px solid #333;
            color: #fff;
            border-radius: 4px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 15px;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background: #ddd; }
        .message {
            padding: 15px;
            margin: 10px 0;
            border-radius: 4px;
            background: #1a1a1a;
        }
        .user { background: #1a1a1a; }
        .assistant { background: #0a2a0a; }
        .error { background: #2a0a0a; color: #ff6b6b; }
        .success { background: #0a2a0a; color: #69db7c; }
    </style>
</head>
<body>
    <h1>Venice AI</h1>

    <!-- API Settings -->
    <div class="section">
        <h2>Settings</h2>
        <label>Venice API Key</label>
        <input type="text" id="apiKey" placeholder="Enter your API key">

        <label>API URL</label>
        <input type="text" id="apiUrl" value="https://api.venice.ai/api/v1">

        <button onclick="saveSettings()">Save Settings</button>
        <div id="settingsMsg"></div>
    </div>

    <!-- Chat -->
    <div class="section">
        <h2>Chat</h2>
        <label>Model</label>
        <select id="model">
            <option value="">Click "Load Models" first</option>
        </select>
        <button onclick="loadModels()">Load Models</button>

        <label>Message</label>
        <textarea id="message" rows="4" placeholder="Type your message..."></textarea>
        <button onclick="sendChat()">Send</button>

        <div id="chatOutput"></div>
    </div>

    <script>
        let settings = { apiKey: '', apiUrl: 'https://api.venice.ai/api/v1' };

        // Load saved settings
        const saved = localStorage.getItem('venice');
        if (saved) {
            settings = JSON.parse(saved);
            document.getElementById('apiKey').value = settings.apiKey;
            document.getElementById('apiUrl').value = settings.apiUrl;
        }

        function saveSettings() {
            settings.apiKey = document.getElementById('apiKey').value.trim();
            settings.apiUrl = document.getElementById('apiUrl').value.trim();

            if (!settings.apiKey) {
                document.getElementById('settingsMsg').innerHTML = '<div class="error">Enter API key</div>';
                return;
            }

            localStorage.setItem('venice', JSON.stringify(settings));
            document.getElementById('settingsMsg').innerHTML = '<div class="success">Saved!</div>';
            loadModels();
        }

        async function loadModels() {
            if (!settings.apiKey) {
                alert('Save your API key first');
                return;
            }

            const select = document.getElementById('model');
            select.innerHTML = '<option>Loading...</option>';

            try {
                const res = await fetch(settings.apiUrl + '/models', {
                    headers: { 'Authorization': 'Bearer ' + settings.apiKey }
                });

                if (!res.ok) throw new Error('API error: ' + res.status);

                const data = await res.json();
                const models = data.data || [];

                select.innerHTML = '';
                models.forEach(m => {
                    const opt = document.createElement('option');
                    opt.value = m.id;
                    opt.textContent = m.id;
                    select.appendChild(opt);
                });

                if (models.length === 0) select.innerHTML = '<option>No models found</option>';

            } catch (e) {
                select.innerHTML = '<option>Error loading models</option>';
                alert('Error: ' + e.message);
            }
        }

        async function sendChat() {
            const model = document.getElementById('model').value;
            const msg = document.getElementById('message').value.trim();
            const output = document.getElementById('chatOutput');

            if (!settings.apiKey) {
                alert('Save your API key first');
                return;
            }

            if (!model || !msg) {
                alert('Select a model and enter a message');
                return;
            }

            // Show user message
            output.innerHTML += '<div class="message user"><strong>You:</strong> ' + msg + '</div>';
            document.getElementById('message').value = '';

            try {
                const res = await fetch(settings.apiUrl + '/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + settings.apiKey,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: model,
                        messages: [{ role: 'user', content: msg }]
                    })
                });

                if (!res.ok) throw new Error('API error: ' + res.status);

                const data = await res.json();
                const reply = data.choices[0].message.content;

                output.innerHTML += '<div class="message assistant"><strong>Assistant:</strong> ' + reply + '</div>';

            } catch (e) {
                output.innerHTML += '<div class="message error"><strong>Error:</strong> ' + e.message + '</div>';
            }
        }

        // Auto-load models if API key exists
        if (settings.apiKey) {
            loadModels();
        }
    </script>
</body>
</html>
