<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>exposé</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #000;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Header */
        .header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1a1a1a;
            background: #000;
            z-index: 10;
        }

        .menu-btn, .settings-btn {
            background: none;
            border: none;
            color: #666;
            font-size: 24px;
            cursor: pointer;
            padding: 8px;
            transition: all 0.2s ease;
            border-radius: 8px;
        }

        .menu-btn:hover, .settings-btn:hover {
            color: #fff;
            background: rgba(255,255,255,0.05);
            transform: scale(1.05);
        }

        .menu-btn:active, .settings-btn:active {
            transform: scale(0.95);
        }

        /* Main Content */
        .main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-y: auto;
            padding: 20px;
            scroll-behavior: smooth;
        }

        .logo {
            font-size: 72px;
            font-family: 'Georgia', serif;
            font-style: italic;
            font-weight: 300;
            text-align: center;
            opacity: 0.9;
            transition: opacity 0.3s ease;
        }

        .output {
            width: 100%;
            max-width: 800px;
            padding: 20px;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .output img, .output video {
            width: 100%;
            border-radius: 12px;
            margin-bottom: 20px;
            animation: fadeIn 0.3s ease;
        }

        /* Bottom Input Area */
        .input-area {
            padding: 20px;
            padding-bottom: 80px;
            border-top: 1px solid #1a1a1a;
            background: #000;
            backdrop-filter: blur(10px);
        }

        /* iOS Safari bottom bar fix */
        @supports (padding: max(0px)) {
            .input-area {
                padding-bottom: max(80px, calc(env(safe-area-inset-bottom) + 40px));
            }
        }

        .input-container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
        }

        .mode-tabs {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
        }

        .mode-tab {
            background: none;
            border: none;
            color: #666;
            font-size: 15px;
            cursor: pointer;
            padding: 8px 0;
            position: relative;
            transition: color 0.2s ease;
        }

        .mode-tab:hover {
            color: #aaa;
        }

        .mode-tab.active {
            color: #fff;
        }

        .mode-tab.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: #fff;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { transform: scaleX(0); }
            to { transform: scaleX(1); }
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
            align-items: flex-end;
            background: #1a1a1a;
            border-radius: 12px;
            padding: 16px;
            transition: background 0.2s ease;
        }

        .input-wrapper:focus-within {
            background: #222;
        }

        .model-select {
            background: #2a2a2a;
            border: none;
            color: #fff;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            max-width: 150px;
            transition: all 0.2s ease;
        }

        .model-select:hover {
            background: #333;
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 17px;
            resize: none;
            outline: none;
            min-height: 80px;
            max-height: 250px;
            font-family: inherit;
            line-height: 1.5;
            padding: 4px 0;
            transition: opacity 0.2s ease;
        }

        textarea::placeholder {
            color: #666;
            transition: color 0.2s ease;
        }

        textarea:focus::placeholder {
            color: #555;
        }

        .send-btn {
            background: #ff4444;
            border: none;
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .send-btn:hover:not(:disabled) {
            background: #ff5555;
            transform: scale(1.1);
        }

        .send-btn:active:not(:disabled) {
            transform: scale(0.95);
        }

        .send-btn:disabled {
            background: #333;
            cursor: not-allowed;
            opacity: 0.5;
        }

        /* Settings Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            padding: 20px;
            overflow-y: auto;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal.active {
            display: block;
            animation: modalFadeIn 0.3s ease forwards;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            max-width: 600px;
            margin: 60px auto;
            animation: modalSlideIn 0.3s ease;
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .modal h2 {
            font-size: 24px;
        }

        .close-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 28px;
            cursor: pointer;
            transition: all 0.2s ease;
            padding: 4px 8px;
            border-radius: 8px;
        }

        .close-btn:hover {
            background: rgba(255,255,255,0.1);
            transform: scale(1.1);
        }

        .close-btn:active {
            transform: scale(0.9);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #999;
            font-size: 14px;
            margin-bottom: 8px;
            transition: color 0.2s ease;
        }

        input[type="text"] {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #555;
            background: #222;
        }

        .save-btn {
            width: 100%;
            background: #fff;
            color: #000;
            border: none;
            padding: 16px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            transform: translateZ(0);
        }

        .save-btn:hover {
            background: #f0f0f0;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255,255,255,0.1);
        }

        .save-btn:active {
            transform: translateY(0);
            box-shadow: none;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            animation: fadeIn 0.3s ease;
        }

        .error {
            background: #2a0000;
            color: #ff6b6b;
            border: 1px solid #ff6b6b33;
        }

        .success {
            background: #002a00;
            color: #69db7c;
            border: 1px solid #69db7c33;
        }

        .loading {
            text-align: center;
            color: #666;
            padding: 40px;
            animation: pulse 1.5s ease infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        /* Hide scrollbar but keep functionality */
        .main::-webkit-scrollbar {
            display: none;
        }
        .main {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
        <button class="settings-btn" onclick="openSettings()">⚙</button>
    </div>

    <!-- Main Content -->
    <div class="main" id="main">
        <div class="logo" id="logo">exposé</div>
        <div class="output" id="output" style="display: none;"></div>
    </div>

    <!-- Bottom Input -->
    <div class="input-area">
        <div class="input-container">
            <div class="mode-tabs">
                <button class="mode-tab active" data-mode="text" onclick="switchMode('text')">💬 Text</button>
                <button class="mode-tab" data-mode="image" onclick="switchMode('image')">🖼 Image</button>
                <button class="mode-tab" data-mode="video" onclick="switchMode('video')">🎬 Video</button>
            </div>
            <div class="input-wrapper">
                <select class="model-select" id="modelSelect">
                    <option>Loading...</option>
                </select>
                <textarea id="promptInput" placeholder="Message..." rows="1" oninput="autoResize(this)"></textarea>
                <button class="send-btn" id="sendBtn" onclick="generate()">↑</button>
            </div>
        </div>
    </div>

    <!-- Menu Modal -->
    <div class="modal" id="menuModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Menu</h2>
                <button class="close-btn" onclick="closeMenu()">×</button>
            </div>
            <div style="display: flex; flex-direction: column; gap: 15px;">
                <button class="save-btn" onclick="openGames()" style="background: #4a9eff; font-size: 16px; padding: 15px;">
                    🎮 Create Games
                </button>
                <button class="save-btn" onclick="closeMenu()" style="background: #333; font-size: 16px; padding: 15px;">
                    Close Menu
                </button>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Settings</h2>
                <button class="close-btn" onclick="closeSettings()">×</button>
            </div>
            <div class="form-group">
                <label>Venice API Key</label>
                <input type="text" id="apiKeyInput" placeholder="Enter your API key">
                <small style="color: #666; display: block; margin-top: 5px;">
                    Get your key at <a href="https://venice.ai" target="_blank" style="color: #fff;">venice.ai</a>
                </small>
            </div>
            <div class="form-group">
                <label>API Base URL</label>
                <input type="text" id="apiUrlInput" value="https://api.venice.ai/api/v1">
            </div>
            <button class="save-btn" onclick="saveSettings()">Save Settings</button>
            <button class="save-btn" onclick="testImageAPI()" style="background: #333; margin-top: 10px;">Test Image Generation</button>
            <button class="save-btn" onclick="testVideoAPI()" style="background: #444; margin-top: 10px;">Test Video Generation</button>
            <button class="save-btn" onclick="showAllModels()" style="background: #555; margin-top: 10px;">Debug: Show All Available Models</button>
            <div id="settingsMsg"></div>
        </div>
    </div>

    <!-- Games Modal -->
    <div class="modal" id="gamesModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>🎮 Create a Mobile Game</h2>
                <button class="close-btn" onclick="closeGames()">×</button>
            </div>
            <p style="color: #999; margin-bottom: 20px;">Choose a game type or describe your own custom game!</p>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px;">
                <button class="save-btn" onclick="selectGameType('sudoku')" style="background: #ff6b6b; font-size: 14px; padding: 12px;">
                    🧩 Sudoku Game
                </button>
                <button class="save-btn" onclick="selectGameType('story')" style="background: #51cf66; font-size: 14px; padding: 12px;">
                    🗺️ Story/Map Game
                </button>
            </div>

            <div class="form-group">
                <label>Game Description</label>
                <textarea id="gamePromptInput" placeholder="Example: Create a simple flappy bird clone with a rocket ship" style="width: 100%; min-height: 120px; background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 8px; font-family: inherit; font-size: 15px;"></textarea>
            </div>
            <button class="save-btn" onclick="generateGame()" style="background: #4a9eff; font-size: 16px;">
                Generate Game
            </button>
            <div id="gameStatus" style="margin-top: 20px;"></div>
            <div id="gameContainer" style="margin-top: 20px;"></div>
        </div>
    </div>

    <script>
        let currentMode = 'text';
        let settings = { apiKey: '', apiUrl: 'https://api.venice.ai/api/v1' };
        let chatHistory = [];

        // Load settings
        const saved = localStorage.getItem('veniceSettings');
        if (saved) {
            settings = JSON.parse(saved);
        }

        // Auto-resize textarea
        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        // Switch mode
        function switchMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.mode === mode);
            });

            // Update placeholder
            const placeholders = {
                text: 'Message...',
                image: 'Describe the image you want...',
                video: 'Describe the video you want...'
            };
            document.getElementById('promptInput').placeholder = placeholders[mode];

            loadModels();
        }

        // Hardcoded Venice models (fallback if API doesn't provide them)
        const knownImageModels = [
            { id: 'fluently-xl', name: 'Fluently XL' },
            { id: 'flux-pro', name: 'Flux Pro' },
            { id: 'flux-1.1-pro', name: 'Flux 1.1 Pro' },
            { id: 'stable-diffusion-xl', name: 'Stable Diffusion XL' }
        ];

        const knownVideoModels = [
            { id: 'wan-2.5-preview', name: 'Wan 2.5 Preview' },
            { id: 'ltx-video', name: 'LTX Video' },
            { id: 'kling-1.5', name: 'Kling 1.5' }
        ];

        // Load models
        async function loadModels() {
            if (!settings.apiKey) {
                document.getElementById('modelSelect').innerHTML = '<option>Set API key</option>';
                return;
            }

            const select = document.getElementById('modelSelect');
            select.innerHTML = '<option>Loading...</option>';

            try {
                const res = await fetch(settings.apiUrl + '/models', {
                    headers: { 'Authorization': 'Bearer ' + settings.apiKey }
                });

                if (!res.ok) {
                    const errorText = await res.text();
                    console.error('API Error:', res.status, errorText);
                    throw new Error('API error: ' + res.status);
                }

                const data = await res.json();
                const allModels = data.data || [];
                console.log('Total models:', allModels.length);
                console.log('All model IDs:', allModels.map(m => m.id).join(', '));

                let models = [...allModels];

                // Filter by mode
                if (currentMode === 'text') {
                    const filtered = allModels.filter(m => {
                        const id = m.id.toLowerCase();
                        // Exclude image and video models
                        return !id.includes('flux') && !id.includes('stable') && !id.includes('sd') &&
                               !id.includes('dall-e') && !id.includes('video') && !id.includes('image') &&
                               !id.includes('wan') && !id.includes('kling') && !id.includes('veo') &&
                               !id.includes('ltx') && !id.includes('longcat') && !id.includes('sora') &&
                               !id.includes('qwen-image') && !id.includes('hidream') && !id.includes('lustify') &&
                               !id.includes('seedream') && !id.includes('nano') && !id.includes('z-image');
                    });
                    models = filtered.length > 0 ? filtered : allModels;
                } else if (currentMode === 'image') {
                    const filtered = allModels.filter(m => {
                        const id = m.id.toLowerCase();
                        return id.includes('flux') || id.includes('stable') || id.includes('sd') ||
                               id.includes('dall-e') || id.includes('image') || id.includes('qwen') ||
                               id.includes('hidream') || id.includes('lustify') || id.includes('seedream') ||
                               id.includes('nano') || id.includes('z-image') || id.includes('gpt-image') ||
                               id.includes('anime');
                    });
                    // If API doesn't return image models, use hardcoded list
                    models = filtered.length > 0 ? filtered : knownImageModels;
                } else if (currentMode === 'video') {
                    const filtered = allModels.filter(m => {
                        const id = m.id.toLowerCase();
                        return id.includes('video') || id.includes('wan') || id.includes('kling') ||
                               id.includes('veo') || id.includes('ltx') || id.includes('longcat') ||
                               id.includes('sora') || id.includes('ovi') || id.includes('img2vid');
                    });
                    // If API doesn't return video models, use hardcoded list
                    models = filtered.length > 0 ? filtered : knownVideoModels;
                }

                console.log('Filtered models for', currentMode + ':', models.length);

                select.innerHTML = '';
                models.forEach(m => {
                    const opt = document.createElement('option');
                    opt.value = m.id;
                    const displayName = m.name || m.id;
                    opt.textContent = displayName.length > 25 ? displayName.substring(0, 25) + '...' : displayName;
                    select.appendChild(opt);
                });

                if (models.length === 0) {
                    select.innerHTML = '<option>No models available</option>';
                }
            } catch (e) {
                console.error('Error loading models:', e);
                select.innerHTML = '<option>Error: ' + e.message + '</option>';
            }
        }

        // Generate content
        async function generate() {
            const prompt = document.getElementById('promptInput').value.trim();
            if (!prompt || !settings.apiKey) {
                if (!settings.apiKey) openSettings();
                return;
            }

            const model = document.getElementById('modelSelect').value;
            const output = document.getElementById('output');
            const logo = document.getElementById('logo');
            const sendBtn = document.getElementById('sendBtn');

            // Show output area
            logo.style.display = 'none';
            output.style.display = 'block';
            sendBtn.disabled = true;

            try {
                if (currentMode === 'text') {
                    output.innerHTML = '<div class="loading">Thinking...</div>';

                    chatHistory.push({ role: 'user', content: prompt });

                    const res = await fetch(settings.apiUrl + '/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Authorization': 'Bearer ' + settings.apiKey,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            model: model,
                            messages: chatHistory
                        })
                    });

                    if (!res.ok) throw new Error('API error: ' + res.status);

                    const data = await res.json();
                    const reply = data.choices[0].message.content;
                    chatHistory.push({ role: 'assistant', content: reply });

                    output.innerHTML = `
                        <div style="background: #1a1a1a; padding: 20px; border-radius: 12px; white-space: pre-wrap;">${reply}</div>
                    `;

                } else if (currentMode === 'image') {
                    output.innerHTML = '<div class="loading">Generating image...</div>';

                    const requestBody = {
                        prompt: prompt,
                        model: model,
                        width: 1024,
                        height: 1024
                    };
                    console.log('Image request:', settings.apiUrl + '/image/generate', requestBody);

                    const res = await fetch(settings.apiUrl + '/image/generate', {
                        method: 'POST',
                        headers: {
                            'Authorization': 'Bearer ' + settings.apiKey,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(requestBody)
                    });

                    if (!res.ok) {
                        const errorText = await res.text();
                        console.error('Image API Error:', res.status, errorText);
                        if (res.status === 404) {
                            throw new Error('Image generation not available with your API key. Visit <a href="https://venice.ai/account" target="_blank" style="color: #ff6b6b;">venice.ai/account</a> to enable it.');
                        }
                        throw new Error(`API error: ${res.status} - ${errorText}`);
                    }

                    const data = await res.json();
                    console.log('Image response:', data);
                    const imageUrl = data.url || data.images?.[0]?.url;

                    if (!imageUrl) throw new Error('No image URL in response');

                    output.innerHTML = `<img src="${imageUrl}" alt="Generated image">`;

                } else if (currentMode === 'video') {
                    output.innerHTML = '<div class="loading">Queuing video generation...</div>';

                    // Step 1: Queue video generation
                    const queueBody = {
                        prompt: prompt,
                        model: model,
                        duration: "5s",  // Required: "5s" or "10s"
                        resolution: "720p",  // Default: "1080p", "720p", or "480p"
                        audio: true  // Generate audio
                    };
                    console.log('Video queue:', settings.apiUrl + '/video/queue', queueBody);

                    const queueRes = await fetch(settings.apiUrl + '/video/queue', {
                        method: 'POST',
                        headers: {
                            'Authorization': 'Bearer ' + settings.apiKey,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(queueBody)
                    });

                    if (!queueRes.ok) {
                        const errorText = await queueRes.text();
                        console.error('Video queue error:', queueRes.status, errorText);
                        if (queueRes.status === 404) {
                            throw new Error('Video generation not available with your API key. Visit <a href="https://venice.ai/account" target="_blank" style="color: #ff6b6b;">venice.ai/account</a> to enable it.');
                        }
                        throw new Error(`Queue error: ${queueRes.status} - ${errorText}`);
                    }

                    const queueData = await queueRes.json();
                    const requestId = queueData.request_id || queueData.id;
                    console.log('Video queued:', requestId);

                    if (!requestId) throw new Error('No request ID from queue');

                    // Step 2: Poll for completion
                    output.innerHTML = '<div class="loading">Generating video...<br><small>Request: ' + requestId.substring(0, 8) + '...</small></div>';

                    let videoUrl = null;
                    let attempts = 0;
                    const maxAttempts = 60; // 5 minutes

                    while (!videoUrl && attempts < maxAttempts) {
                        await new Promise(resolve => setTimeout(resolve, 5000));

                        const retrieveRes = await fetch(settings.apiUrl + '/video/retrieve', {
                            method: 'POST',
                            headers: {
                                'Authorization': 'Bearer ' + settings.apiKey,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({ request_id: requestId })
                        });

                        if (retrieveRes.ok) {
                            const retrieveData = await retrieveRes.json();
                            console.log('Video status:', retrieveData);

                            if (retrieveData.status === 'completed' && retrieveData.url) {
                                videoUrl = retrieveData.url;
                            } else if (retrieveData.status === 'failed') {
                                throw new Error('Generation failed: ' + (retrieveData.error || 'Unknown'));
                            }
                        }

                        attempts++;
                        const pct = Math.round((attempts / maxAttempts) * 100);
                        output.innerHTML = '<div class="loading">Generating video... ' + pct + '%<br><small>Attempt ' + attempts + '/' + maxAttempts + '</small></div>';
                    }

                    if (!videoUrl) throw new Error('Video generation timed out');

                    output.innerHTML = `
                        <video controls autoplay>
                            <source src="${videoUrl}" type="video/mp4">
                        </video>
                    `;
                }

                document.getElementById('promptInput').value = '';
            } catch (e) {
                output.innerHTML = `<div style="background: #2a0000; color: #ff6b6b; padding: 20px; border-radius: 12px;">Error: ${e.message}</div>`;
            } finally {
                sendBtn.disabled = false;
            }
        }

        // Settings
        function openSettings() {
            document.getElementById('settingsModal').classList.add('active');
            document.getElementById('apiKeyInput').value = settings.apiKey;
            document.getElementById('apiUrlInput').value = settings.apiUrl;
        }

        function closeSettings() {
            document.getElementById('settingsModal').classList.remove('active');
        }

        function saveSettings() {
            settings.apiKey = document.getElementById('apiKeyInput').value.trim();
            settings.apiUrl = document.getElementById('apiUrlInput').value.trim();

            if (!settings.apiKey) {
                document.getElementById('settingsMsg').innerHTML = '<div class="error">Enter API key</div>';
                return;
            }

            localStorage.setItem('veniceSettings', JSON.stringify(settings));
            document.getElementById('settingsMsg').innerHTML = '<div class="success">Saved!</div>';

            setTimeout(() => {
                closeSettings();
                loadModels();
            }, 1000);
        }

        function toggleMenu() {
            document.getElementById('menuModal').classList.add('active');
        }

        function closeMenu() {
            document.getElementById('menuModal').classList.remove('active');
        }

        function openGames() {
            closeMenu();
            document.getElementById('gamesModal').classList.add('active');
        }

        function closeGames() {
            document.getElementById('gamesModal').classList.remove('active');
        }

        function selectGameType(type) {
            const promptInput = document.getElementById('gamePromptInput');

            if (type === 'sudoku') {
                promptInput.value = 'Create an interactive Sudoku puzzle game with:\n- 9x9 grid with proper sudoku rules\n- Difficulty selector (Easy, Medium, Hard)\n- Number input buttons\n- Check solution button\n- Hint system\n- Timer\n- Clean, mobile-friendly interface with touch support\n- Highlight selected cell and related cells\n- Show errors when invalid numbers are placed';
            } else if (type === 'story') {
                promptInput.value = 'Create an interactive story-based adventure game with:\n- Multiple choice decisions that affect the story\n- A simple map showing player location\n- Inventory system for items\n- Character stats (health, items collected)\n- At least 5 different story scenarios\n- Mobile-friendly touch interface\n- Save/load progress feature\n- Engaging storyline with meaningful choices\n- Visual indicators for different locations';
            }
        }

        async function generateGame() {
            const prompt = document.getElementById('gamePromptInput').value.trim();
            const statusDiv = document.getElementById('gameStatus');
            const containerDiv = document.getElementById('gameContainer');

            if (!prompt) {
                statusDiv.innerHTML = '<div class="error">Please describe the game you want to create</div>';
                return;
            }

            // Reload settings from localStorage to ensure we have the latest API key
            const saved = localStorage.getItem('veniceSettings');
            if (saved) {
                settings = JSON.parse(saved);
            }

            if (!settings.apiKey || settings.apiKey.trim() === '') {
                statusDiv.innerHTML = '<div class="error">❌ No API key found.<br><br>Please set your Venice API key first.<br><br><button class="save-btn" onclick="closeGames(); openSettings();" style="margin-top: 10px;">Open Settings</button></div>';
                return;
            }

            statusDiv.innerHTML = '<div class="loading">Generating your game... This may take a moment.</div>';
            containerDiv.innerHTML = '';

            try {
                // First, let's get a valid text model
                statusDiv.innerHTML = '<div class="loading">Finding best AI model for game generation...</div>';

                const modelsRes = await fetch(settings.apiUrl + '/models', {
                    headers: { 'Authorization': 'Bearer ' + settings.apiKey }
                });

                if (!modelsRes.ok) {
                    throw new Error('Failed to fetch models. Status: ' + modelsRes.status);
                }

                const modelsData = await modelsRes.json();
                const allModels = modelsData.data || [];

                // Find a good text model (prefer llama-3.3-70b, claude, or gpt-4)
                let gameModel = allModels.find(m => m.id === 'llama-3.3-70b');
                if (!gameModel) gameModel = allModels.find(m => m.id.includes('claude'));
                if (!gameModel) gameModel = allModels.find(m => m.id.includes('gpt-4'));
                if (!gameModel) gameModel = allModels.find(m => m.id.includes('llama'));
                if (!gameModel) gameModel = allModels[0]; // fallback to first available

                if (!gameModel) {
                    throw new Error('No text models available for your API key');
                }

                console.log('Using model for game generation:', gameModel.id);
                statusDiv.innerHTML = '<div class="loading">Generating your game with ' + gameModel.id + '... This may take a moment.</div>';

                const systemPrompt = `You are an expert HTML5 game developer. Create a complete, playable mobile game based on the user's description.

IMPORTANT REQUIREMENTS:
1. Generate a COMPLETE, SELF-CONTAINED HTML file with embedded CSS and JavaScript
2. The game must work on mobile devices (touch controls)
3. Use HTML5 Canvas for rendering
4. Include touch event handlers for mobile
5. Make it fun and visually appealing
6. Include a score display
7. Add simple sound effects using Web Audio API if appropriate
8. Make sure the game is responsive and fits mobile screens
9. Include a "Play Again" button when game ends
10. Use only vanilla JavaScript - no external libraries

Output ONLY the complete HTML code, nothing else. Start with <!DOCTYPE html> and end with </html>.`;

                const res = await fetch(settings.apiUrl + '/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + settings.apiKey,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: gameModel.id,
                        messages: [
                            { role: 'system', content: systemPrompt },
                            { role: 'user', content: prompt }
                        ],
                        temperature: 0.7,
                        max_tokens: 4000
                    })
                });

                if (!res.ok) {
                    const errorText = await res.text();
                    console.error('API Error Response:', errorText);
                    if (res.status === 401) {
                        throw new Error('Invalid or missing API key. Please check your API key in Settings and make sure it\'s valid. You may need to generate a new API key at venice.ai/settings/api');
                    }
                    throw new Error('API error ' + res.status + ': ' + errorText);
                }

                const data = await res.json();
                console.log('API Response:', data);

                if (!data.choices || !data.choices[0] || !data.choices[0].message) {
                    throw new Error('Invalid API response format. Response: ' + JSON.stringify(data));
                }

                let gameCode = data.choices[0].message.content;

                // Extract HTML if wrapped in code blocks
                if (gameCode.includes('```html')) {
                    gameCode = gameCode.split('```html')[1].split('```')[0].trim();
                } else if (gameCode.includes('```')) {
                    gameCode = gameCode.split('```')[1].split('```')[0].trim();
                }

                // Create iframe to display the game
                const iframe = document.createElement('iframe');
                iframe.style.width = '100%';
                iframe.style.height = '600px';
                iframe.style.border = '2px solid #333';
                iframe.style.borderRadius = '12px';
                iframe.style.background = '#fff';

                containerDiv.innerHTML = '';
                containerDiv.appendChild(iframe);

                // Write game code to iframe
                const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                iframeDoc.open();
                iframeDoc.write(gameCode);
                iframeDoc.close();

                statusDiv.innerHTML = '<div class="success">✓ Game generated successfully! Play it below.</div>';

                // Add download button
                const downloadBtn = document.createElement('button');
                downloadBtn.className = 'save-btn';
                downloadBtn.textContent = 'Download Game';
                downloadBtn.style.marginTop = '10px';
                downloadBtn.onclick = () => {
                    const blob = new Blob([gameCode], { type: 'text/html' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'my-game.html';
                    a.click();
                    URL.revokeObjectURL(url);
                };
                statusDiv.appendChild(downloadBtn);

            } catch (e) {
                statusDiv.innerHTML = '<div class="error">Failed to generate game: ' + e.message + '</div>';
                console.error('Game generation error:', e);
            }
        }

        async function testVideoAPI() {
            const msgDiv = document.getElementById('settingsMsg');
            const key = document.getElementById('apiKeyInput').value.trim();
            const url = document.getElementById('apiUrlInput').value.trim();

            if (!key) {
                msgDiv.innerHTML = '<div class="error">Enter API key first</div>';
                return;
            }

            msgDiv.innerHTML = '<div class="loading">Finding available video models...</div>';

            try {
                // First, fetch available models to get a valid video model
                const modelsRes = await fetch(url + '/models', {
                    headers: { 'Authorization': 'Bearer ' + key }
                });

                if (!modelsRes.ok) {
                    throw new Error('Failed to fetch models: ' + modelsRes.status);
                }

                const modelsData = await modelsRes.json();
                const allModels = modelsData.data || [];

                // Find video models
                const videoModels = allModels.filter(m => {
                    const id = m.id.toLowerCase();
                    return id.includes('video') || id.includes('wan') || id.includes('kling') ||
                           id.includes('veo') || id.includes('ltx') || id.includes('longcat') ||
                           id.includes('sora') || id.includes('ovi');
                });

                if (videoModels.length === 0) {
                    msgDiv.innerHTML = '<div class="error">❌ No video models available.<br><br>Your API key may not have access to video generation.<br><br><strong>Total models found:</strong> ' + allModels.length + '<br><br>Click "Debug: Show All Available Models" to see what you can access.<br><br>Visit <a href="https://venice.ai/settings/api" target="_blank" style="color: #ff6b6b;">venice.ai/settings/api</a> to regenerate your API key with video access.</div>';
                    return;
                }

                const testModel = videoModels[0].id;
                msgDiv.innerHTML = '<div class="loading">Testing video generation with model: ' + testModel + '...</div>';

                const res = await fetch(url + '/video/queue', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + key,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        prompt: "a red cube rotating",
                        model: testModel,
                        duration: "5s",
                        resolution: "720p",
                        audio: true
                    })
                });

                const text = await res.text();
                console.log('Video test response:', res.status, text);

                if (res.status === 404) {
                    msgDiv.innerHTML = '<div class="error">❌ Video generation endpoint not found (404).<br><br><strong>Response:</strong> ' + text + '<br><br>Visit <a href="https://venice.ai/settings/api" target="_blank" style="color: #ff6b6b;">venice.ai/settings/api</a></div>';
                } else if (res.status === 401) {
                    msgDiv.innerHTML = '<div class="error">❌ Unauthorized (401) - Check your API key</div>';
                } else if (res.status === 402) {
                    msgDiv.innerHTML = '<div class="error">❌ Payment Required (402) - Insufficient credits/balance<br><br>Visit <a href="https://venice.ai/settings/api" target="_blank" style="color: #ff6b6b;">venice.ai/settings/api</a> to add credits</div>';
                } else if (!res.ok) {
                    msgDiv.innerHTML = `<div class="error">API Error: ${res.status}<br><strong>Response:</strong><br>${text}</div>`;
                } else {
                    const data = JSON.parse(text);
                    msgDiv.innerHTML = '<div class="success">✓ Video generation works!<br><br><strong>Model:</strong> ' + testModel + '<br><strong>Request ID:</strong> ' + (data.request_id || data.id || 'Unknown') + '<br><br>You can use video mode.</div>';
                }
            } catch (e) {
                msgDiv.innerHTML = `<div class="error">Test failed: ${e.message}</div>`;
            }
        }

        async function showAllModels() {
            const msgDiv = document.getElementById('settingsMsg');
            const key = document.getElementById('apiKeyInput').value.trim();
            const url = document.getElementById('apiUrlInput').value.trim();

            if (!key) {
                msgDiv.innerHTML = '<div class="error">Enter API key first</div>';
                return;
            }

            msgDiv.innerHTML = '<div class="loading">Fetching all models...</div>';

            try {
                const modelsRes = await fetch(url + '/models', {
                    headers: { 'Authorization': 'Bearer ' + key }
                });

                if (!modelsRes.ok) {
                    throw new Error('Failed to fetch models: ' + modelsRes.status);
                }

                const modelsData = await modelsRes.json();
                const allModels = modelsData.data || [];

                // Categorize models
                const videoModels = allModels.filter(m => {
                    const id = m.id.toLowerCase();
                    return id.includes('video') || id.includes('wan') || id.includes('kling') ||
                           id.includes('veo') || id.includes('ltx') || id.includes('longcat') ||
                           id.includes('sora') || id.includes('ovi');
                });

                const imageModels = allModels.filter(m => {
                    const id = m.id.toLowerCase();
                    return id.includes('flux') || id.includes('stable') || id.includes('sd') ||
                           id.includes('dall-e') || id.includes('image') || id.includes('qwen') ||
                           id.includes('hidream') || id.includes('lustify') || id.includes('seedream');
                });

                const textModels = allModels.filter(m => !videoModels.includes(m) && !imageModels.includes(m));

                let html = '<div style="background: #1a1a1a; padding: 15px; border-radius: 8px; max-height: 400px; overflow-y: auto; text-align: left;">';
                html += '<h3 style="margin: 0 0 10px 0;">Models Available to Your API Key</h3>';

                html += '<p><strong>Total Models:</strong> ' + allModels.length + '</p>';

                html += '<p style="color: #4a9eff;"><strong>Video Models (' + videoModels.length + '):</strong></p>';
                if (videoModels.length > 0) {
                    html += '<ul style="margin: 5px 0; padding-left: 20px;">';
                    videoModels.forEach(m => html += '<li>' + m.id + '</li>');
                    html += '</ul>';
                } else {
                    html += '<p style="color: #ff6b6b;">❌ No video models available</p>';
                }

                html += '<p style="color: #4a9eff;"><strong>Image Models (' + imageModels.length + '):</strong></p>';
                if (imageModels.length > 0) {
                    html += '<ul style="margin: 5px 0; padding-left: 20px;">';
                    imageModels.slice(0, 10).forEach(m => html += '<li>' + m.id + '</li>');
                    if (imageModels.length > 10) html += '<li>... and ' + (imageModels.length - 10) + ' more</li>';
                    html += '</ul>';
                } else {
                    html += '<p style="color: #ff6b6b;">❌ No image models available</p>';
                }

                html += '<p style="color: #4a9eff;"><strong>Text Models (' + textModels.length + '):</strong></p>';
                if (textModels.length > 0) {
                    html += '<ul style="margin: 5px 0; padding-left: 20px;">';
                    textModels.slice(0, 10).forEach(m => html += '<li>' + m.id + '</li>');
                    if (textModels.length > 10) html += '<li>... and ' + (textModels.length - 10) + ' more</li>';
                    html += '</ul>';
                }

                html += '</div>';
                msgDiv.innerHTML = html;
            } catch (e) {
                msgDiv.innerHTML = `<div class="error">Failed to fetch models: ${e.message}</div>`;
            }
        }

        // Enter to send
        document.getElementById('promptInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                generate();
            }
        });

        // Auto-open settings if no API key
        if (!settings.apiKey) {
            setTimeout(() => openSettings(), 500);
        } else {
            loadModels();
        }
    </script>
