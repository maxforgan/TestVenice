<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>exposé</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #000;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        .header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1a1a1a;
        }

        .menu-btn, .settings-btn {
            background: none;
            border: none;
            color: #666;
            font-size: 24px;
            cursor: pointer;
            padding: 8px;
        }

        /* Main Content */
        .main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-y: auto;
            padding: 20px;
        }

        .logo {
            font-size: 72px;
            font-family: 'Georgia', serif;
            font-style: italic;
            font-weight: 300;
            text-align: center;
            opacity: 0.9;
        }

        .output {
            width: 100%;
            max-width: 800px;
            padding: 20px;
        }

        .output img, .output video {
            width: 100%;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        /* Bottom Input Area */
        .input-area {
            padding: 20px;
            padding-bottom: 80px;
            border-top: 1px solid #1a1a1a;
            background: #000;
        }

        /* iOS Safari bottom bar fix */
        @supports (padding: max(0px)) {
            .input-area {
                padding-bottom: max(80px, calc(env(safe-area-inset-bottom) + 40px));
            }
        }

        .input-container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
        }

        .mode-tabs {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
        }

        .mode-tab {
            background: none;
            border: none;
            color: #666;
            font-size: 15px;
            cursor: pointer;
            padding: 8px 0;
            position: relative;
        }

        .mode-tab.active {
            color: #fff;
        }

        .mode-tab.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: #fff;
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
            align-items: flex-end;
            background: #1a1a1a;
            border-radius: 12px;
            padding: 12px;
        }

        .model-select {
            background: #2a2a2a;
            border: none;
            color: #fff;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            max-width: 150px;
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 16px;
            resize: none;
            outline: none;
            min-height: 24px;
            max-height: 120px;
            font-family: inherit;
        }

        textarea::placeholder {
            color: #666;
        }

        .send-btn {
            background: #ff4444;
            border: none;
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-btn:disabled {
            background: #333;
            cursor: not-allowed;
        }

        /* Settings Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            padding: 20px;
            overflow-y: auto;
        }

        .modal.active {
            display: block;
        }

        .modal-content {
            max-width: 600px;
            margin: 60px auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .modal h2 {
            font-size: 24px;
        }

        .close-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 28px;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #999;
            font-size: 14px;
            margin-bottom: 8px;
        }

        input[type="text"] {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
        }

        .save-btn {
            width: 100%;
            background: #fff;
            color: #000;
            border: none;
            padding: 16px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
        }

        .error { background: #2a0000; color: #ff6b6b; }
        .success { background: #002a00; color: #69db7c; }

        .loading {
            text-align: center;
            color: #666;
            padding: 40px;
        }

        /* Hide scrollbar but keep functionality */
        .main::-webkit-scrollbar {
            display: none;
        }
        .main {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
        <button class="settings-btn" onclick="openSettings()">⚙</button>
    </div>

    <!-- Main Content -->
    <div class="main" id="main">
        <div class="logo" id="logo">exposé</div>
        <div class="output" id="output" style="display: none;"></div>
    </div>

    <!-- Bottom Input -->
    <div class="input-area">
        <div class="input-container">
            <div class="mode-tabs">
                <button class="mode-tab active" data-mode="text" onclick="switchMode('text')">💬 Text</button>
                <button class="mode-tab" data-mode="image" onclick="switchMode('image')">🖼 Image</button>
                <button class="mode-tab" data-mode="video" onclick="switchMode('video')">🎬 Video</button>
            </div>
            <div class="input-wrapper">
                <select class="model-select" id="modelSelect">
                    <option>Loading...</option>
                </select>
                <textarea id="promptInput" placeholder="Message..." rows="1" oninput="autoResize(this)"></textarea>
                <button class="send-btn" id="sendBtn" onclick="generate()">↑</button>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Settings</h2>
                <button class="close-btn" onclick="closeSettings()">×</button>
            </div>
            <div class="form-group">
                <label>Venice API Key</label>
                <input type="text" id="apiKeyInput" placeholder="Enter your API key">
                <small style="color: #666; display: block; margin-top: 5px;">
                    Get your key at <a href="https://venice.ai" target="_blank" style="color: #fff;">venice.ai</a>
                </small>
            </div>
            <div class="form-group">
                <label>API Base URL</label>
                <input type="text" id="apiUrlInput" value="https://api.venice.ai/api/v1">
            </div>
            <button class="save-btn" onclick="saveSettings()">Save Settings</button>
            <div id="settingsMsg"></div>
        </div>
    </div>

    <script>
        let currentMode = 'text';
        let settings = { apiKey: '', apiUrl: 'https://api.venice.ai/api/v1' };
        let chatHistory = [];

        // Load settings
        const saved = localStorage.getItem('veniceSettings');
        if (saved) {
            settings = JSON.parse(saved);
        }

        // Auto-resize textarea
        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        // Switch mode
        function switchMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.mode === mode);
            });

            // Update placeholder
            const placeholders = {
                text: 'Message...',
                image: 'Describe the image you want...',
                video: 'Describe the video you want...'
            };
            document.getElementById('promptInput').placeholder = placeholders[mode];

            loadModels();
        }

        // Hardcoded Venice models (fallback if API doesn't provide them)
        const knownImageModels = [
            { id: 'flux-1.1-pro', name: 'Flux 2 Pro' },
            { id: 'flux-pro', name: 'Flux Pro' },
            { id: 'sd-3.5', name: 'Venice SD35' },
            { id: 'dall-e-3', name: 'DALL-E 3' }
        ];

        const knownVideoModels = [
            { id: 'wan-2.5-preview', name: 'Wan 2.5 Preview' },
            { id: 'ltx-video-2.0', name: 'LTX Video 2.0' },
            { id: 'kling-2.6-pro', name: 'Kling 2.6 Pro' },
            { id: 'veo-3', name: 'Veo 3' },
            { id: 'sora-2', name: 'Sora 2' }
        ];

        // Load models
        async function loadModels() {
            if (!settings.apiKey) {
                document.getElementById('modelSelect').innerHTML = '<option>Set API key</option>';
                return;
            }

            const select = document.getElementById('modelSelect');
            select.innerHTML = '<option>Loading...</option>';

            try {
                const res = await fetch(settings.apiUrl + '/models', {
                    headers: { 'Authorization': 'Bearer ' + settings.apiKey }
                });

                if (!res.ok) {
                    const errorText = await res.text();
                    console.error('API Error:', res.status, errorText);
                    throw new Error('API error: ' + res.status);
                }

                const data = await res.json();
                const allModels = data.data || [];
                console.log('Total models:', allModels.length);
                console.log('All model IDs:', allModels.map(m => m.id).join(', '));

                let models = [...allModels];

                // Filter by mode
                if (currentMode === 'text') {
                    const filtered = allModels.filter(m => {
                        const id = m.id.toLowerCase();
                        // Exclude image and video models
                        return !id.includes('flux') && !id.includes('stable') && !id.includes('sd') &&
                               !id.includes('dall-e') && !id.includes('video') && !id.includes('image') &&
                               !id.includes('wan') && !id.includes('kling') && !id.includes('veo') &&
                               !id.includes('ltx') && !id.includes('longcat') && !id.includes('sora') &&
                               !id.includes('qwen-image') && !id.includes('hidream') && !id.includes('lustify') &&
                               !id.includes('seedream') && !id.includes('nano') && !id.includes('z-image');
                    });
                    models = filtered.length > 0 ? filtered : allModels;
                } else if (currentMode === 'image') {
                    const filtered = allModels.filter(m => {
                        const id = m.id.toLowerCase();
                        return id.includes('flux') || id.includes('stable') || id.includes('sd') ||
                               id.includes('dall-e') || id.includes('image') || id.includes('qwen') ||
                               id.includes('hidream') || id.includes('lustify') || id.includes('seedream') ||
                               id.includes('nano') || id.includes('z-image') || id.includes('gpt-image') ||
                               id.includes('anime');
                    });
                    // If API doesn't return image models, use hardcoded list
                    models = filtered.length > 0 ? filtered : knownImageModels;
                } else if (currentMode === 'video') {
                    const filtered = allModels.filter(m => {
                        const id = m.id.toLowerCase();
                        return id.includes('video') || id.includes('wan') || id.includes('kling') ||
                               id.includes('veo') || id.includes('ltx') || id.includes('longcat') ||
                               id.includes('sora') || id.includes('ovi') || id.includes('img2vid');
                    });
                    // If API doesn't return video models, use hardcoded list
                    models = filtered.length > 0 ? filtered : knownVideoModels;
                }

                console.log('Filtered models for', currentMode + ':', models.length);

                select.innerHTML = '';
                models.forEach(m => {
                    const opt = document.createElement('option');
                    opt.value = m.id;
                    const displayName = m.name || m.id;
                    opt.textContent = displayName.length > 25 ? displayName.substring(0, 25) + '...' : displayName;
                    select.appendChild(opt);
                });

                if (models.length === 0) {
                    select.innerHTML = '<option>No models available</option>';
                }
            } catch (e) {
                console.error('Error loading models:', e);
                select.innerHTML = '<option>Error: ' + e.message + '</option>';
            }
        }

        // Generate content
        async function generate() {
            const prompt = document.getElementById('promptInput').value.trim();
            if (!prompt || !settings.apiKey) {
                if (!settings.apiKey) openSettings();
                return;
            }

            const model = document.getElementById('modelSelect').value;
            const output = document.getElementById('output');
            const logo = document.getElementById('logo');
            const sendBtn = document.getElementById('sendBtn');

            // Show output area
            logo.style.display = 'none';
            output.style.display = 'block';
            sendBtn.disabled = true;

            try {
                if (currentMode === 'text') {
                    output.innerHTML = '<div class="loading">Thinking...</div>';

                    chatHistory.push({ role: 'user', content: prompt });

                    const res = await fetch(settings.apiUrl + '/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Authorization': 'Bearer ' + settings.apiKey,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            model: model,
                            messages: chatHistory
                        })
                    });

                    if (!res.ok) throw new Error('API error: ' + res.status);

                    const data = await res.json();
                    const reply = data.choices[0].message.content;
                    chatHistory.push({ role: 'assistant', content: reply });

                    output.innerHTML = `
                        <div style="background: #1a1a1a; padding: 20px; border-radius: 12px; white-space: pre-wrap;">${reply}</div>
                    `;

                } else if (currentMode === 'image') {
                    output.innerHTML = '<div class="loading">Generating image...</div>';

                    const res = await fetch(settings.apiUrl + '/images/generations', {
                        method: 'POST',
                        headers: {
                            'Authorization': 'Bearer ' + settings.apiKey,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            prompt: prompt,
                            model: model,
                            n: 1
                        })
                    });

                    if (!res.ok) throw new Error('API error: ' + res.status);

                    const data = await res.json();
                    const imageUrl = data.data[0].url;

                    output.innerHTML = `<img src="${imageUrl}" alt="Generated image">`;

                } else if (currentMode === 'video') {
                    output.innerHTML = '<div class="loading">Generating video... This may take a few minutes.</div>';

                    const res = await fetch(settings.apiUrl + '/videos/generations', {
                        method: 'POST',
                        headers: {
                            'Authorization': 'Bearer ' + settings.apiKey,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            prompt: prompt,
                            model: model
                        })
                    });

                    if (!res.ok) throw new Error('API error: ' + res.status);

                    const data = await res.json();
                    const videoUrl = data.data ? data.data[0].url : data.url;

                    output.innerHTML = `
                        <video controls autoplay>
                            <source src="${videoUrl}" type="video/mp4">
                        </video>
                    `;
                }

                document.getElementById('promptInput').value = '';
            } catch (e) {
                output.innerHTML = `<div style="background: #2a0000; color: #ff6b6b; padding: 20px; border-radius: 12px;">Error: ${e.message}</div>`;
            } finally {
                sendBtn.disabled = false;
            }
        }

        // Settings
        function openSettings() {
            document.getElementById('settingsModal').classList.add('active');
            document.getElementById('apiKeyInput').value = settings.apiKey;
            document.getElementById('apiUrlInput').value = settings.apiUrl;
        }

        function closeSettings() {
            document.getElementById('settingsModal').classList.remove('active');
        }

        function saveSettings() {
            settings.apiKey = document.getElementById('apiKeyInput').value.trim();
            settings.apiUrl = document.getElementById('apiUrlInput').value.trim();

            if (!settings.apiKey) {
                document.getElementById('settingsMsg').innerHTML = '<div class="error">Enter API key</div>';
                return;
            }

            localStorage.setItem('veniceSettings', JSON.stringify(settings));
            document.getElementById('settingsMsg').innerHTML = '<div class="success">Saved!</div>';

            setTimeout(() => {
                closeSettings();
                loadModels();
            }, 1000);
        }

        function toggleMenu() {
            // Placeholder for menu functionality
            alert('Menu coming soon!');
        }

        // Enter to send
        document.getElementById('promptInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                generate();
            }
        });

        // Auto-open settings if no API key
        if (!settings.apiKey) {
            setTimeout(() => openSettings(), 500);
        } else {
            loadModels();
        }
    </script>
</body>
</html>
