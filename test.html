<!DOCTYPE html>
<html>
<head>
    <title>Venice Test</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background: #000;
            color: #fff;
            font-family: sans-serif;
            padding: 20px;
        }
        input, button {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            font-size: 16px;
        }
        input {
            background: #111;
            border: 1px solid #333;
            color: #fff;
        }
        button {
            background: #fff;
            color: #000;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Venice API Test</h1>
    <p>Version: TEST-2024</p>

    <label>API Key:</label>
    <input type="text" id="api-key" placeholder="Enter API key">

    <label>Base URL:</label>
    <input type="text" id="base-url" value="https://api.venice.ai/api/v1">

    <button onclick="save()">Save & Test</button>

    <div id="result"></div>

    <script>
        function save() {
            const key = document.getElementById('api-key').value;
            const url = document.getElementById('base-url').value;

            localStorage.setItem('venice', JSON.stringify({key, url}));
            document.getElementById('result').innerHTML = '<p style="color: lime;">Saved! Key: ' + key.substring(0, 10) + '...</p>';

            // Test API
            fetch(url + '/models', {
                headers: {'Authorization': 'Bearer ' + key}
            })
            .then(r => r.json())
            .then(data => {
                document.getElementById('result').innerHTML += '<p>Models found: ' + data.data.length + '</p>';
            })
            .catch(e => {
                document.getElementById('result').innerHTML += '<p style="color: red;">Error: ' + e.message + '</p>';
            });
        }

        // Load saved
        const saved = localStorage.getItem('venice');
        if (saved) {
            const {key, url} = JSON.parse(saved);
            document.getElementById('api-key').value = key;
            document.getElementById('base-url').value = url;
        }
    </script>
</body>
</html>
